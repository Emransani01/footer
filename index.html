<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">


</head>
<body>
    <footer class="footer">
    <div class="contact-container">
        <div class="contact-info">
            <h2 class="section-title">Lets Connect</h2>
            <p class="section-description">Please fill out the form on this section to contact with me or call between 9.00 A.M and 8..00 P.M ET , Monday through Friday.</p>
            <div class="social-links">
                <img src="./images/icons/facebook.png" alt="">
                <img src="./images/icons/insta.png" alt="">
                <img src="./images/icons/python-5 1.png" alt="">
            </div>
        </div>
        <div class="contact-form">
            <h2 class="section-title">Let's message me</h2>
                <form>
                    <input type="text" class="form-input" placeholder="Your name">
                    <input type="email" class="form-input" placeholder="Your email">
                    <textarea class="form-textarea" name="message" placeholder="message"></textarea>
                    <button class="btn-primary">submit</button>
              </form>

        </div>
    </div>
    </footer>
                           
</body>
</html>
